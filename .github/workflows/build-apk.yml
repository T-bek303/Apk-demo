name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept All Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "89338d0d9f18181af18b60f2186c5177e0d7248e" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f51854795309e07a18f2207b3b923f9e4248b" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a53fe443057e84e5a9bc0e22e1e" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "601085b94cd77f0b54ff864069570991500085d7" > "$ANDROID_HOME/licenses/android-googletv-license"
          echo "33b6a2b64925e14245c814341047e6765e79a8d8" > "$ANDROID_HOME/licenses/google-gdk-license"
          echo "d975f751698a77b662f1254ddbeed3901e176f4a" > "$ANDROID_HOME/licenses/intel-android-extra-license"
          echo "e9acab5b5fbb560a72cfa4e233b49e307337d158" > "$ANDROID_HOME/licenses/mips-android-sysimage-license"
          yes | sdkmanager --licenses || yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AI-TebeagStoryboard-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "AI TebeagStoryboard v1.0.0 (APK)"
          body: "Silakan unduh file APK di bawah ini dan pasang langsung di HP Android Anda."
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
